ssh_remote_deploy/enabled=0
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=PackedStringArray()
ssh_remote_deploy/extra_args_scp=PackedStringArray()
ssh_remote_deploy/run_script="#!/usr/bin/env sh
export DEPLOY_TIME_SEC=$(date +%s)
\
{START_NOTIFY_CMD}
{START_DEPLOY_SERVICE}
sleep 1
export GODOT_PID=$(pgrep -x -U $UID $EXEC_NAME)
open -j -a {TEMP_DIR}/{APP_NAME}.app
echo $GODOT_PID
{END_DEPLOY_SERVICE}
{END_NOTIFY_CMD}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env sh
export DEPLOY_TIME_SEC=$(date +%s)
\
{START_NOTIFY_CMD}
{START_DEPLOY_SERVICE}
sleep 1
if ! ps -p $GODOT_PID > /dev/null; then
	exit 0
fi
sleep 1
pkill -P $GODOT_PID
kill $GODOT_PID
echo $GODOT_PID
{END_DEPLOY_SERVICE}
{END_NOTIFY_CMD}"
