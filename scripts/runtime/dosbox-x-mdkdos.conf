# dosbox-x-mdkdos.conf — DOSBox-X config for the MDK DOS runtime lane.
#
# Launch target : runtime-private/dos/mdk/MDKDOS.EXE (BUILD_A DOS exe,
#                 PROVISIONAL_RUNTIME_SOURCE — repack, NoCD-fixed)
# Emulator      : DOSBox-X 2026.08.31 (SDL2, Homebrew formula, arm64)
# Values informed by BUILD_A's bundled DOSBOX.CONF (DOSBox 0.72 vintage).

[sdl]
fullscreen       = false
output           = default
autolock         = false
waitonerror      = true
priority         = higher,normal
mapperfile       = mapper-dosbox-x.map
usescancodes     = true

[dosbox]
# svga_s3 provides VESA modes MDK's renderer expects; vgaonly is too small.
machine          = svga_s3
captures         = runtime-private/captures
memsize          = 32

[render]
frameskip        = 0
aspect           = false
scaler           = none

[cpu]
core             = auto
cycles           = max
cycleup          = 500
cycledown        = 20

[mixer]
nosound          = false
rate             = 22050
blocksize        = 2048
prebuffer        = 10

[midi]
mpu401           = intelligent
device           = default

[sblaster]
sbtype           = sb16
sbbase           = 220
irq              = 5
dma              = 1
hdma             = 5
oplmode          = auto
oplrate          = 22050

[gus]
gus              = false

[speaker]
pcspeaker        = true
pcrate           = 22050
tandy            = auto
disney           = true

[joystick]
joysticktype     = auto
timed            = true

[serial]
serial1          = dummy
serial2          = dummy
serial3          = disabled
serial4          = disabled

[dos]
xms              = true
ems              = true
umb              = true
keyboardlayout   = none

[ipx]
ipx              = false

[autoexec]
# Mount the writable runtime copy and launch the real DOS executable.
# (BUILD_A's repack wrapper MDK.EXE is DOSBox 0.72 itself — never used here.)
mount C "runtime-private/dos/mdk"
C:
# Guest-side observation TSR (shotkey.s): periodic video-RAM dumps to
# C:\SHnn.BIN + scripted BIOS-buffer keystrokes. Lives only in the
# disposable runtime copy; remove this line for a plain interactive run.
SHOTKEY.COM
MDKDOS.EXE
# Intentionally no `exit`: post-exit state/errors stay visible for capture.
