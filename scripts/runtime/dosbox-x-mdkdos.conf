# dosbox-x-mdkdos.conf — DOSBox-X config for the MDK DOS runtime lane.
#
# Launch target : runtime-private/dos/mdk/MDKDOS.EXE (BUILD_A DOS exe,
#                 PROVISIONAL_RUNTIME_SOURCE — repack, NoCD-fixed)
# Emulator      : DOSBox-X 2026.08.31 (SDL2, Homebrew formula, arm64)
# Values informed by BUILD_A's bundled DOSBOX.CONF (DOSBox 0.72 vintage).

[sdl]
# Windowed default. MDK renders 640x480 (VESA 0x4101, already 4:3 square
# pixels) so a fixed 1280x960 window is an exact 2x integer scale — crisp
# pixels, correct aspect, no stretching. Alt+Enter toggles fullscreen.
# (windowresolution=original restores the native 640x480 window.)
fullscreen       = false
output           = default
windowresolution = 1280x960
# Mouse capture: autolock grabs on first click; CAPMOUSE /C in autoexec
# captures at launch — MDK needs locked (relative-motion) mouse input.
autolock         = true
waitonerror      = true
priority         = higher,normal
mapperfile       = mapper-dosbox-x.map
usescancodes     = true
# Emulate relative mouse motion only while the pointer is captured
# (default in DOSBox-X, stated explicitly since MDK depends on it).
mouse_emulation  = locked
# 0 = never convert wheel to keys: wheel events reach the emulated mouse.
# Correct generic default (avoids wheel->arrow-key noise in menus). NB:
# MDKDOS.EXE exposes only X/Y axes — no Z-axis binding exists (observed).
mouse_wheel_key  = 0

[dosbox]
# svga_s3 provides VESA modes MDK's renderer expects; vgaonly is too small.
machine          = svga_s3
captures         = runtime-private/captures
memsize          = 32

[render]
frameskip        = 0
aspect           = false
scaler           = none

[cpu]
# core=normal (interpreter): the dynamic core was unstable with this
# DOS/4GW title — E_Exit faults mid-run (int8 descriptor / wild writes).
core             = normal
cycles           = max
cycleup          = 500
cycledown        = 20

[mixer]
nosound          = false
rate             = 22050
blocksize        = 2048
prebuffer        = 10

[midi]
mpu401           = intelligent
device           = default

[sblaster]
sbtype           = sb16
sbbase           = 220
irq              = 5
dma              = 1
hdma             = 5
oplmode          = auto
oplrate          = 22050

[gus]
gus              = false

[speaker]
pcspeaker        = true
pcrate           = 22050
tandy            = auto
disney           = true

[joystick]
joysticktype     = auto
timed            = true

[serial]
# For SNAP.COM frame dumps: serial1 = file file:<host-path>
# streams guest COM1 output straight to a host file (no DOS calls needed
# in interrupt context). Default keeps the port inert.
serial1          = dummy
serial2          = dummy
serial3          = disabled
serial4          = disabled

[dos]
xms              = true
ems              = true
umb              = true
keyboardlayout   = none

[ipx]
ipx              = false

[keyboard]
# intellimouse = wheel-capable PS/2 AUX device (DOSBox-X default, explicit
# here for reproducibility).
auxdevice        = intellimouse

[autoexec]
# Mount the writable runtime copy and launch the real DOS executable.
# (BUILD_A's repack wrapper MDK.EXE is DOSBox 0.72 itself — never used here.)
mount C "runtime-private/dos/mdk"
C:
# Capture the host mouse at launch (deterministic; Ctrl+F10 releases).
CAPMOUSE /C
# Optional automation TSRs (generated into the runtime copy by
# analysis-private/scripts/, see docs/reverse-engineering/RUNTIME_ORACLE.md):
#   INJKEY.COM — keyboard-controller (8042 cmd 0xD2) scancode injection on a
#                tick schedule: menu -> New Game -> save -> movement -> quit.
#   SNAP.COM   — one-shot VESA bank dump to COM1 (needs serial1=file).
# Guarded so a plain runtime copy still launches interactively.
if exist INJKEY.COM INJKEY.COM
if exist SNAP.COM SNAP.COM
MDKDOS.EXE
# Intentionally no `exit`: post-exit state/errors stay visible for capture.
